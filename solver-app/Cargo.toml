[package]
name = "hot-seat-solver"
version = "1.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Hot Seat Solver: runs big postflop solves on your own computer for hotseatpoker.com"

[dependencies]
# Same solver wrapper the website uses, compiled natively (no browser memory limit).
hsp_solver = { path = "../solver" }
# Turn on multi-threading in the solver engine (by Wataru Inariba, AGPL-3.0-or-later).
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", rev = "9d1509fe5077d019825f833eed04b16d342dfda1", default-features = false, features = ["rayon"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
