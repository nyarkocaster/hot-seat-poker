<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">

<title>Solver · Hot Seat Poker</title>
<meta name="description" content="A free heads-up postflop solver that runs in your browser.">
<script>try{var t=localStorage.getItem("hsp-theme");document.documentElement.dataset.theme=t==="light"?"light":"dark"}catch(e){}</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<div class="wrap">
  <header class="top">
    <h1><a href="/" class="home-link">Hot Seat Poker</a> <span class="muted">· Solver</span></h1>
    <span class="spacer"></span>
    <button class="b sm" type="button" id="themeBtn">Light mode</button>
  </header>
  <div id="solver"></div>
  <footer class="sfoot note">

    Source code for this site: <a href="https://github.com/nyarkocaster/hot-seat-poker" target="_blank" rel="noopener">github.com/nyarkocaster/hot-seat-poker</a>.
